logging:
  level:
    org.springdoc: INFO

spring:
  application:
    name: tfi
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/tfi
    username: tfi
    password: tfi
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
    default-encoding: UTF-8
    test-connection: false

springdoc:
  override-with-generic-response: false

server:
  port: 8080

mp:
  api:
    public-key: ${MP_PUBLIC_KEY}
    access-token: ${MP_ACCESS_TOKEN}
  sena-percent: 0.30

app:
  base-url: ${APP_PUBLIC_BASE_URL}
  public-base-url: ${APP_PUBLIC_BASE_URL}

  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: 20

wa:
  api:
    enabled: false
    base-url: http://localhost:9999/mock-wa
    token: dummy
    from-number: "+5493510000000"